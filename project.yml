name: ArmaMac
options:
  bundleIdPrefix: com.armamac
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: NO
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  ArmaMac:
    type: application
    platform: macOS
    sources:
      - path: Sources/ArmaMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.armamac.launcher
        PRODUCT_NAME: ArmaMac
        INFOPLIST_FILE: Sources/ArmaMac/Resources/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: Sources/ArmaMac/Resources/ArmaMac-Bridging-Header.h
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/Sources/ArmaMac/Core/SteamClient"
        GCC_C_LANGUAGE_STANDARD: gnu11
        ENABLE_APP_SANDBOX: NO
        ENABLE_USER_SELECTED_FILES: readwrite
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"

  ArmaMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/ArmaMacTests
    dependencies:
      - target: ArmaMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.armamac.launcher.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  ArmaMac:
    build:
      targets:
        ArmaMac: all
        ArmaMacTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ArmaMacTests
